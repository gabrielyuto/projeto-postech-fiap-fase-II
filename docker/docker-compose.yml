services:
  auth-service:
    build: ./services/auth-service-main
    container_name: auth-service
    ports:
      - "8001:8001"
    env_file:
       - ./services/auth-service-main/.env
    depends_on:
      postgres:
        condition: service_healthy    
    restart: unless-stopped
    networks:
      - toggle-master-network
  flag-service:
    build: ./services/flag-service-main
    container_name: flag-service
    ports:
      - "8002:8002"
    env_file:
       - ./services/flag-service-main/.env
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - toggle-master-network
  targeting-service:
    build: ./services/targeting-service-main
    container_name: targeting-service
    ports:
      - "8003:8003"
    env_file:
       - ./services/targeting-service-main/.env
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - toggle-master-network
  evaluation-service:
    build: ./services/evaluation-service-main
    container_name: evaluation-service
    ports:
      - "8004:8004"
    env_file:
       - ./services/evaluation-service-main/.env
    depends_on:
      flag-service:
        condition: service_healthy
      targeting-service:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticmq:
        condition: service_started
    restart: unless-stopped
    networks:
      - toggle-master-network
  analytics-service:
    build: ./services/analytics-service-main
    container_name: analytics-service
    ports:
      - "8005:8005"
    env_file:
      - ./services/analytics-service-main/.env
    depends_on:
      elasticmq:
        condition: service_started
      dynamodb-local:
        condition: service_healthy
      evaluation-service:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - toggle-master-network 
  postgres:
    image: postgres:15
    container_name: postgres
    ports:
      - "5432:5432"
    env_file:
      - ./local/postgres/.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./services/auth-service-main/db/init.sql:/docker-entrypoint-initdb.d/auth-service.sql
      - ./services/flag-service-main/db/init.sql:/docker-entrypoint-initdb.d/flag-service.sql
      - ./services/targeting-service-main/db/init.sql:/docker-entrypoint-initdb.d/targeting-service.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - toggle-master-network
  redis:
    image: redis:8.10.0
    container_name: redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - toggle-master-network
  elasticmq:
    image: softwaremill/elasticmq-native:latest
    container_name: elasticmq
    ports:
      - "9324:9324"
      - "9325:9325"
    volumes:
      - "./local/elasticmq/elasticmq.conf:/opt/elasticmq.conf"
    networks:
      - toggle-master-network
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    container_name: dynamodb-local
    command: "-jar DynamoDBLocal.jar -sharedDb -dbPath ./data"
    user: root
    ports:
      - "8000:8000"
    volumes:
      - "dynamodb-data:/home/dynamodblocal/data"
    working_dir: /home/dynamodblocal
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:8000 || exit 1"]
      interval: 2s
      timeout: 2s
      retries: 15
    networks:
      - toggle-master-network
  dynamodb-init:
    image: amazon/aws-cli:latest
    container_name: dynamodb-init
    depends_on:
      dynamodb-local:
        condition: service_healthy
    environment:
      - AWS_ACCESS_KEY_ID=fake
      - AWS_SECRET_ACCESS_KEY=fake
      - AWS_DEFAULT_REGION=us-east-1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        aws --endpoint-url=http://dynamodb-local:8000 dynamodb create-table \
          --table-name ToggleMasterAnalytics \
          --attribute-definitions AttributeName=event_id,AttributeType=S \
          --key-schema AttributeName=event_id,KeyType=HASH \
          --billing-mode PAY_PER_REQUEST \
          --region us-east-1 || echo "Tabela já existe, seguindo em frente."
    networks:
      - toggle-master-network

volumes:
  postgres_data:
  dynamodb-data:

networks:
  toggle-master-network: