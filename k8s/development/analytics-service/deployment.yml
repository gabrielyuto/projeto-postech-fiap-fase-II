apiVersion: apps/v1
kind: Deployment
metadata:
  name:  analytics-service
  namespace:  development
spec:
  replicas: 1
  selector:
    matchLabels:
      name:  analytics-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  template:
    metadata:
      labels:
        name:  analytics-service
    spec:
      containers:
      - name:  analytics-service
        image:  projeto-postech-fiap-fase-ii-analytics-service:latest
        imagePullPolicy: Never
        ports:
        - name: http
          containerPort: 8005
        envFrom:
        - configMapRef:
            name: analytics-service-config
        - secretRef:
            name: analytics-service-secret
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8005
          initialDelaySeconds: 10
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /health
            port: 8005
          initialDelaySeconds: 5
          timeoutSeconds: 10
