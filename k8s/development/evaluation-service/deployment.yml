apiVersion: apps/v1
kind: Deployment
metadata:
  name: evaluation-service
  namespace: development
  labels:
    app: evaluation-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: evaluation-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app: evaluation-service
    spec:
      containers:
      - name: evaluation-service
        image: projeto-postech-fiap-fase-ii-evaluation-service:latest
        imagePullPolicy: Never
        ports:
        - name: http
          containerPort: 8004
        envFrom:
        - configMapRef:
            name: evaluation-service-config
        - secretRef:
            name: evaluation-service-secret
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8004
          initialDelaySeconds: 10
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /health
            port: 8004
          initialDelaySeconds: 5
          periodSeconds: 10
      