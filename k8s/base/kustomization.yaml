apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Recursos comuns a todos os ambientes. Nomes de imagem, credenciais e
# endpoints de infraestrutura (banco, cache, fila) são responsabilidade
# de cada overlay em k8s/overlays/<ambiente>.
resources:
  - auth-service
  - flag-service
  - targeting-service
  - evaluation-service
  - analytics-service
  - postgres-init
