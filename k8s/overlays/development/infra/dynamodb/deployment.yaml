apiVersion: apps/v1
kind: Deployment
metadata:
  name: dynamodb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dynamodb
  template:
    metadata:
      labels:
        app: dynamodb
    spec:
      containers:
        - name: dynamodb
          image: amazon/dynamodb-local:latest
          command: ["java"]
          args:
            - "-jar"
            - "DynamoDBLocal.jar"
            - "-sharedDb"
            - "-dbPath"
            - "/home/dynamodblocal/data"
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: dynamodb-config
            - secretRef:
                name: dynamodb-credential
          volumeMounts:
            - name: dynamodb-storage
              mountPath: /home/dynamodblocal/data
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: dynamodb-storage
          persistentVolumeClaim:
            claimName: dynamodb-data-pvc
