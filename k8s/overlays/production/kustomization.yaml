apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: production

resources:
  - namespace.yaml
  - ../../base
  - db-init
  - ingress.yaml
  - secrets/auth-service-secret.yaml
  - secrets/flag-service-secret.yaml
  - secrets/targeting-service-secret.yaml
  - secrets/evaluation-service-secret.yaml
  - secrets/analytics-service-secret.yaml
  - secrets/postgres-admin-secret.yaml

# APP_ENV=production faz os serviços usarem os SDKs reais da AWS (sem
# endpoints locais). Credenciais via AWS_ACCESS_KEY_ID/SECRET/SESSION_TOKEN
# nos secrets (IRSA indisponível neste lab), em vez dos emuladores de development.
configMapGenerator:
  - name: evaluation-service-config
    behavior: merge
    literals:
      - APP_ENV=production
  - name: analytics-service-config
    behavior: merge
    literals:
      - APP_ENV=production

# Segredos com dados reais (RDS/ElastiCache/SQS/DynamoDB), já em base64
# (campo "data"), apontando para os recursos reais provisionados na AWS.
# SERVICE_API_KEY em evaluation-service-secret é um placeholder: gere uma
# chave via POST /admin/keys no auth-service já implantado e faça
# "kubectl patch secret evaluation-service-secret" com o valor real.

# Imagens publicadas no ECR, seguindo o padrão togglemaster/<nome-do-serviço>.
# Preferencialmente, deixe que a pipeline de CI/CD rode "kustomize edit set
# image" com a tag real (ex: o SHA do commit) antes do deploy, em vez de usar
# "latest".
images:
  - name: auth-service
    newName: 180981210379.dkr.ecr.us-east-1.amazonaws.com/togglemaster/auth-service
    newTag: latest
  - name: flag-service
    newName: 180981210379.dkr.ecr.us-east-1.amazonaws.com/togglemaster/flag-service
    newTag: latest
  - name: targeting-service
    newName: 180981210379.dkr.ecr.us-east-1.amazonaws.com/togglemaster/targeting-service
    newTag: latest
  - name: evaluation-service
    newName: 180981210379.dkr.ecr.us-east-1.amazonaws.com/togglemaster/evaluation-service
    newTag: latest
  - name: analytics-service
    newName: 180981210379.dkr.ecr.us-east-1.amazonaws.com/togglemaster/analytics-service
    newTag: latest

replicas:
  - name: analytics-service
    count: 2
  - name: evaluation-service
    count: 2
  - name: auth-service
    count: 2
  - name: flag-service
    count: 2
  - name: targeting-service
    count: 2