services:

  # Auth Service
  auth-service:
    build: ./auth-service-main
    container_name: auth-service
    ports:
      - "8001:8001"
    env_file:
       - ./auth-service-main/.env
    depends_on:
      - postgres
    restart: unless-stopped
    networks:
      - fiap-docker-desafio-network

  # Targeting Service
  targeting-service:
    build: ./targeting-service-main
    container_name: targeting-service
    ports:
      - "8003:8003"
    env_file:
       - ./targeting-service-main/.env
    depends_on:
      - auth-service
      - postgres
    restart: unless-stopped
    networks:
      - fiap-docker-desafio-network

  # Flag Service
  flag-service:
    build: ./flag-service-main
    container_name: flag-service
    ports:
      - "8002:8002"
    env_file:
       - ./flag-service-main/.env
    depends_on:
      - postgres
      - auth-service
    restart: unless-stopped
    networks:
      - fiap-docker-desafio-network

  # Evaluation Service
  evaluation-service:
    build: ./evaluation-service-main
    container_name: evaluation-service
    ports:
      - "8004:8004"
    env_file:
       - ./evaluation-service-main/.env
    depends_on:
      - flag-service
      - targeting-service
      - redis
    restart: unless-stopped
    networks:
      - fiap-docker-desafio-network

  # Postgres Service    
  postgres:
    image: postgres:15
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./auth-service-main/db/init.sql:/docker-entrypoint-initdb.d/auth-service.sql
      - ./flag-service-main/db/init.sql:/docker-entrypoint-initdb.d/flag-service.sql
      - ./targeting-service-main/db/init.sql:/docker-entrypoint-initdb.d/targeting-service.sql
    
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 5
    
    restart: unless-stopped
    networks:
      - fiap-docker-desafio-network

  # Redis Service
  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - fiap-docker-desafio-network

volumes:
  postgres_data:

networks:
  fiap-docker-desafio-network: